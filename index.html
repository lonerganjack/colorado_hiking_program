<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Trail to Treadmill</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="app-header">
    <h1>Trail to Treadmill</h1>
    <p class="subtitle">Colorado hikes, SF gym</p>
  </header>

  <main id="app-content">
    <!-- Views rendered here by app.js -->
  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="schedule">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Schedule</span>
    </button>
    <button class="nav-btn" data-view="library">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <span>Library</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
